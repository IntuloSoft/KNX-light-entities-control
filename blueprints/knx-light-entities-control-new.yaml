blueprint:
  name: KNX - Light entities control
  description: |
    Use KNX to control an Home Assistant light entity with optional switching, relative dimming, absolute dimming, tunable white, and RGB color telegrams (+ state feedback)
    **Version**: 2026.10.1
  author: Pieter Cardoen - based on kalhimeo
  source_url: https://github.com/IntuloSoft/KNX-light-entities-control/raw/refs/heads/main/blueprints/knx-light-entities-control.yaml
  domain: automation
  input:
    light_entity:
      name: Light Entity
      description: >
        Choose the light to control and expose with KNX
      selector:
        entity:
          domain: light
    dimm_entity:
      name: Helper for relative dimming function
      description: >
        Relative dimming requires a dedicated Number Helper to store the current dimming level for this light. Create one manually and select it below. If no helper is selected, relative dimming will remain disabled.
      selector:
        entity:
          domain:
            - input_number
      default: []
    switch_address:
      name: Switch group address(es)
      description: >
        Group address(es) for switching the lights on and off. DPT 1.001
        Example: '1/0/1'
      default: null
      selector:
        text:
          multiple : true
    dimm_address:
      name: Relative dimming group address(es)
      description: >
        Group address(es) for relative dimming the lights (+/-). DPT 3.007
        Example: '1/1/1'
      default: null
      selector:
        text:
          multiple : true
    value_address:
      name: Absolute dimming group address(es)
      description: >
        Group address(es) for absolute dimming of the light (0-100%). DPT 5.001
        Example: '1/2/1'
      default: null
      selector:
        text:
          multiple : true
    rgb_color_address:
      name: RGB color group address(es)
      description: >
        Group address(es) for RGB color of the light (r,g,b). DPT 232.600
        Example: '1/3/1'
      default: null
      selector:
        text:
          multiple : true
    temperature_address:
      name: Tunable white temperature group address(es)
      description: >
        Group address(es) for white temperature of the light (0-100%). DPT 7.600
        Example: '1/7/1'
      default: null
      selector:
        text:
          multiple : true
    switch_state_address:
      name: Switch state group address
      description: >
        Group address to send feedback of the state of the light. DPT 1.001
        Example: '1/4/1' (leave empty if unused)
      default: null
      selector:
        text:
          multiple : false
    value_state_address:
      name: Brightness state group address
      description: >
        Group address to send feedback of the brightess of the light. DPT 5.001
        Example: '1/5/1' (leave empty if unused)
      default: null
    rgb_color_state_address:
      name: RGB color state group address
      description: >
        Group address to send feedback of the RGB color of the light. DPT 232.600
        Example: '1/6/1' (leave empty if unused)
      default: null
    temperature_state_address:
      name: Tunable white temperature state group address
      description: >
        Group address to send feedback of the white temperature of the light. DPT 7.600
        Example: '1/7/1' (leave empty if unused)
      default: null
    mode:
      name: Mode
      default: Step
      description: >
        Select the relative dimming mode.

        - Disabled: Relative dimming is disabled.
        - Step: Changes brightness using fixed steps (configured in "Dim Steps").
        - TransitionStep: Changes brightness using a sequence of transient steps for a smoother fade.
        - Transition: Uses a single transition from the current brightness directly to the minimum or maximum brightness (formerly reduce_server_load).

        If the selected light entity does not support transitions, both TransitionStep and Transition modes fall back to Step mode.
      selector:
        select:
          options:
            - Disabled
            - Step
            - TransitionStep
            - Transition
    dimm_time:
      name: Dimm time
      description: Time dimming from 0 to 100% shall take.
      selector:
        number:
          min: 1.0
          max: 20.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider
      default: 5
    dimm_steps:
      name: Dimm steps
      description: Steps used to dimm from 0 to 100%.
      selector:
        number:
          min: 2.0
          max: 100.0
          step: 1.0
          unit_of_measurement: steps
          mode: slider
      default: 20
    dimm_prevent_turn_off:
      name: Disable switch off with dimm down command
      description: If enabled, the dimm down command won't cause the light to switch off when reaching 0% (keep the light at minimum dimm)
      selector:
        boolean:
      default: false
    dimm_prevent_turn_on:
      name: Disable switch on with dimm up command
      description: If enabled, the dimm up command won't cause the light to switch on if it's actual state is off
      selector:
        boolean:
      default: false

mode: parallel
max_exceeded: silent

variables:
  light_entity: !input light_entity
  dimm_entity: !input dimm_entity
  switch_address: !input switch_address
  dimm_address: !input dimm_address
  value_address: !input value_address
  rgb_color_address: !input rgb_color_address
  temperature_address: !input temperature_address
  switch_state_address: !input switch_state_address
  value_state_address: !input value_state_address
  rgb_color_state_address: !input rgb_color_state_address
  temperature_state_address: !input temperature_state_address
  mode: !input mode
  _dimm_time: !input dimm_time
  _dimm_steps: !input dimm_steps
  dimm_prevent_turn_off: !input dimm_prevent_turn_off
  dimm_prevent_turn_on: !input dimm_prevent_turn_on
  dimm_time: "{{ _dimm_time | float(default=5) }}"
  dimm_steps: "{{ _dimm_steps | int(default=20) }}"
  dimm_step: "{{ (255 / dimm_steps) | round(0,'ceil') }}"
  dimm_step_ms: "{{ dimm_time * 1000 / 255 * dimm_step }}"
  initial_brightness: "{{ (state_attr(light_entity, 'brightness') | int(default=0)) }}"
  FLAG_DIMMING: 1
  FLAG_DIRECTION_UP: 2
  FLAG_STATE_ON: 4
  transition_supported: "{{ ((states[light_entity].attributes.supported_features|bitwise_and(32)) == 32) | bool(default=false) }}"
  has_dimm_entity: "{{ dimm_entity is defined and dimm_entity not in [None, []] }}"
  effective_mode: >
    {% if mode == 'Disabled' %}
      Disabled
    {% elif not has_dimm_entity %}
      Disabled
    {% elif (mode in ['Transition', 'TransitionStep']) and not transition_supported %}
      Step
    {% else %}
      {{ mode }}
    {% endif %}
  is_disabled_mode: "{{ effective_mode == 'Disabled' }}"
  is_step_mode: "{{ effective_mode == 'Step' }}"
  is_transition_mode: "{{ effective_mode == 'Transition' }}"
  is_transition_step_mode: "{{ effective_mode == 'TransitionStep' }}"

trigger_variables:
  _switch_address: !input switch_address
  _dimm_address: !input dimm_address
  _value_address: !input value_address
  _rgb_color_address: !input rgb_color_address
  _temperature_address: !input temperature_address
  _switch_state_address: !input switch_state_address
  _value_state_address: !input value_state_address
  _rgb_color_state_address: !input rgb_color_state_address
  _temperature_state_address: !input temperature_state_address

triggers:
  - platform: state
    entity_id: !input light_entity
    id: "light_entity"
  - platform: knx.telegram
    destination: !input switch_address
    group_value_read: false
    group_value_response: false
    id: "switch_address"
    enabled: "{{ _switch_address != None }}"
  - platform: knx.telegram
    destination: !input dimm_address
    group_value_read: false
    group_value_response: false
    id: "dimm_address"
    enabled: "{{ _dimm_address != None }}"
  - platform: knx.telegram
    destination: !input value_address
    group_value_read: false
    group_value_response: false
    id: "value_address"
    enabled: "{{ _value_address != None }}"
  - platform: knx.telegram
    destination: !input rgb_color_address
    group_value_read: false
    group_value_response: false
    id: "rgb_color_address"
    enabled: "{{ _rgb_color_address != None }}"
  - platform: knx.telegram
    destination: !input temperature_address
    group_value_read: false
    group_value_response: false
    type: "color_temperature"
    id: "temperature_address"
    enabled: "{{ _temperature_address != None }}"
  - platform: knx.telegram
    destination: !input switch_state_address
    group_value_write : false
    group_value_response: false
    id: "switch_state_address"
    enabled: "{{ _switch_state_address != None }}"
  - platform: knx.telegram
    destination: !input value_state_address
    group_value_write : false
    group_value_response: false
    id: "value_state_address"
    enabled: "{{ _value_state_address != None }}"
  - platform: knx.telegram
    destination: !input rgb_color_state_address
    group_value_write : false
    group_value_response: false
    id: "rgb_color_state_address"
    enabled: "{{ _rgb_color_state_address != None }}"
  - platform: knx.telegram
    destination: !input temperature_state_address
    group_value_write : false
    group_value_response: false
    id: "temperature_state_address"
    enabled: "{{ _temperature_state_address != None }}"

actions:
  - choose:
    # SWITCH command
    - conditions:
        - condition: trigger
          id: "switch_address"
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | int(default=0) == 0 }}"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: "{{ light_entity }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | int(default=0) == 1 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"

    # SWITCH read
    - conditions:
        - condition: trigger
          id: "switch_state_address"
      sequence:
        - if:
            - condition: or
              conditions:
                - condition: state
                  entity_id: !input light_entity
                  state: "off"
                - condition: state
                  entity_id: !input light_entity
                  state: "unavailable"
                - condition: state
                  entity_id: !input light_entity
                  state: "unknown"
          then:
            - action: knx.send
              data:
                address: "{{ switch_state_address }}"
                payload: 0
                response: true
          else:
            - action: knx.send
              data:
                address: "{{ switch_state_address }}"
                payload: 1
                response: true

    # DIM command
    - conditions:
        - condition: trigger
          id: "dimm_address"
        - condition: template
          value_template: "{{ effective_mode != 'Disabled' }}"
      sequence:
        - variables:
            is_stop_command: "{{ trigger.payload == 0  or trigger.payload == 8 }}"
            is_dim_up_command: "{{ 9 <= trigger.payload <= 15 }}"
            is_dim_down_command: "{{ 1 <= trigger.payload <= 7 }}"

        - choose:
          # stop command
          - conditions:
              - condition: template
                value_template: "{{ is_stop_command }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                then:
                  - variables:
                      dimming_active: "{{ (states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) == FLAG_DIMMING }}"
                  - if:
                      - condition: template
                        value_template: "{{ dimming_active }}"
                    then:
                      - variables:
                          current_DimmSeconds: >-
                            {{ now().timestamp() - (states[dimm_entity].last_changed | as_datetime | as_local).timestamp() }}
                          dimm_Fraction: >-
                            {{ current_DimmSeconds * 1000 / dimm_step_ms }}
                          current_Brightness: >-
                            {% if (states(dimm_entity) | int | bitwise_and(FLAG_DIRECTION_UP)) == FLAG_DIRECTION_UP %}
                              {{ ((((((((states(dimm_entity) | float(0)) - (states(dimm_entity) | int)) * 1000) + dimm_Fraction * dimm_step) | round(0,'trunc') | int(0)), 255) | min), 0) | max }}
                            {% else %}
                              {{ ((((((((states(dimm_entity) | float(0)) - (states(dimm_entity) | int)) * 1000) - dimm_Fraction * dimm_step) | round(0,'trunc') | int(0)), 0) | max), 255) | min }}
                            {% endif %}
                      - action: light.turn_on
                        data:
                          brightness: "{{ current_Brightness }}"
                          transition: 0
                        target:
                          entity_id: "{{ light_entity }}"
              - action: input_number.set_value
                data:
                  value: "{{ states(dimm_entity) | float - (states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) }}" # Remove Dimming Flag
                target:
                  entity_id: !input dimm_entity
          # start dimm up command
          - conditions:
              - condition: template
                value_template: "{{ is_dim_up_command }}"
              - condition: template
                value_template: "{{ not (dimm_prevent_turn_on and states(light_entity) == 'off') }}"
              - condition: template
                value_template: "{{ initial_brightness < 255 }}"
            sequence:
              - variables:
                  current_dimm_steps: "{{ ((255 - initial_brightness) / 255 * dimm_steps) | round(0, 'ceil') | int }}"
              # Step
              - action: input_number.set_value
                data:
                  value: "{{ (states(dimm_entity) | int | bitwise_or(FLAG_DIMMING) | bitwise_or(FLAG_DIRECTION_UP)) + (initial_brightness / 1000) }}" # Add Dimming Flag, add DirectionUp Flag, + Value
                target:
                  entity_id: !input dimm_entity
              - if:
                  - condition: template
                    value_template: "{{ is_transition_mode }}"
                then:
                  - action: light.turn_on
                    data:
                      brightness: 255
                      transition: "{{ (255 - initial_brightness) / 255 * dimm_time }}"
                    target:
                      entity_id: "{{ light_entity }}"
              - repeat:
                  sequence:
                    - variables:
                        next_Brightness: "{{ (initial_brightness + (repeat.index * dimm_step), 255) | min }}"
                        transition_time: >-
                          {% if repeat.index >= current_dimm_steps %}
                            {{ (255 - ((initial_brightness + ((repeat.index - 1) * dimm_step), 255) | min)) / dimm_step * dimm_step_ms }}
                          {% else %}
                            {{ dimm_step_ms }}
                          {% endif %}
                    # - if:
                    #     - condition: template
                    #       value_template: "{{ is_step_mode }}"
                    #   then:
                    #     - action: light.turn_on
                    #       data:
                    #         brightness: "{{ next_Brightness }}"
                    #       target:
                    #         entity_id: "{{ light_entity }}"
                    - if:
                        - condition: template
                          value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ is_transition_step_mode }}"
                          then:
                            - action: light.turn_on
                              data:
                                brightness: "{{ next_Brightness }}"
                                transition: "{{ transition_time / 1000 }}"
                              target:
                                entity_id: "{{ light_entity }}"
                        - if:
                            - condition: template
                              value_template: "{{ repeat.first and (initial_brightness == 0) and ((states(dimm_entity) | int | bitwise_and(FLAG_STATE_ON)) != FLAG_STATE_ON) }}" # Last sent state was 'off'
                          then:
                            - action: knx.send
                              data:
                                address: "{{ switch_state_address }}"
                                payload: 1
                            - action: input_number.set_value
                              data:
                                value: "{{ states(dimm_entity) | float - (states(dimm_entity) | int) + (states(dimm_entity) | int | bitwise_or(FLAG_STATE_ON)) }}" # Add StateOn Flag
                              target:
                                entity_id: !input dimm_entity
                    - wait_template: "{{ (states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) != FLAG_DIMMING }}"
                      timeout:
                        milliseconds: "{{ transition_time }}"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ not wait.completed }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ is_step_mode }}"
                          then:
                            - action: light.turn_on
                              data:
                                brightness: "{{ next_Brightness }}"
                              target:
                                entity_id: "{{ light_entity }}"
                        - if:
                            - condition: template
                              value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ value_state_address != None }}"
                              then:
                                - action: knx.send
                                  data:
                                    address: "{{ value_state_address }}"
                                    payload: "{{ ((((((((states(dimm_entity) | float(0)) - (states(dimm_entity) | int)) * 1000) + dimm_step) | round(0,'trunc') | int(0)), 255) | min), 0) | max }}"
                        - if:
                            - condition: template
                              value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                          then:
                            - action: input_number.set_value
                              data:
                                value: "{{ states(dimm_entity) | int + (next_Brightness / 1000) }}"
                              target:
                                entity_id: !input dimm_entity
                  until:
                    - condition: template
                      value_template: "{{ ((states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) != FLAG_DIMMING) or (repeat.index >= current_dimm_steps) }}"
              - action: input_number.set_value
                data:
                  value: 0
                target:
                  entity_id: !input dimm_entity
          # start dimm down command
          - conditions:
              - condition: template
                value_template: "{{ is_dim_down_command }}"
              - condition: template
                value_template: "{{ ((not dimm_prevent_turn_off) and initial_brightness > 0) or (initial_brightness > 1) }}"
            sequence:
              - variables:
                  target_brightness: "{{ 1 if dimm_prevent_turn_off else 0 }}"
                  current_dimm_steps: >-
                    {% if dimm_prevent_turn_off %}
                      {{ (([(initial_brightness - 1), 0] | max) / 255 * dimm_steps) | round(0, 'ceil') | int }}
                    {% else %}
                      {{ (initial_brightness / 255 * dimm_steps) | round(0, 'ceil') | int }}
                    {% endif %}
              # Step
              - action: input_number.set_value
                data:
                  value: "{{
                    (states(dimm_entity) | int | bitwise_and(FLAG_STATE_ON) | bitwise_or(FLAG_DIMMING))
                     + (initial_brightness / 1000)
                    }}" # Keep only StateOn Flag, Add Dimming Flag, + Value
                target:
                  entity_id: !input dimm_entity
              - if:
                  - condition: template
                    value_template: "{{ is_transition_mode }}"
                then:
                  - action: light.turn_on
                    data:
                      brightness: target_brightness
                      transition: "{{ (initial_brightness - target_brightness) / 255 * dimm_time }}"
                    target:
                      entity_id: "{{ light_entity }}"
              - repeat:
                  sequence:
                    - variables:
                        next_Brightness: >-
                          {% if dimm_prevent_turn_off and (initial_brightness - (repeat.index * dimm_step)) < 1 %}
                            1
                          {% else %}
                            {{ (initial_brightness - (repeat.index * dimm_step), 0) | max }}
                          {% endif %}
                        transition_time: >-
                          {% if repeat.index >= current_dimm_steps %}
                            {{ (((initial_brightness - ((repeat.index - 1) * dimm_step), 0) | max)) / dimm_step * dimm_step_ms }}
                          {% else %}
                            {{ dimm_step_ms }}
                          {% endif %}
                    - if:
                        - condition: template
                          value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ is_transition_step_mode }}"
                          then:
                            - action: light.turn_on
                              data:
                                brightness: "{{ next_Brightness }}"
                                transition: "{{ transition_time / 1000 }}"
                              target:
                                entity_id: "{{ light_entity }}"
                    - wait_template: "{{ (states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) != FLAG_DIMMING }}"
                      timeout:
                        milliseconds: "{{ transition_time }}"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ not wait.completed }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ is_step_mode }}"
                          then:
                            - action: light.turn_on
                              data:
                                brightness: "{{ next_Brightness }}"
                              target:
                                entity_id: "{{ light_entity }}"
                        
                        - if:
                            - condition: template
                              value_template: "{{ is_transition_mode or is_transition_step_mode }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ value_state_address != None }}"
                              then:
                                - action: knx.send
                                  data:
                                    address: "{{ value_state_address }}"
                                    payload: "{{ ((((((((states(dimm_entity) | float(0)) - (states(dimm_entity) | int)) * 1000) - dimm_step) | round(0,'trunc') | int(0)), target_brightness) | max), 255) | min }}"
                            - action: input_number.set_value
                              data:
                                value: "{{ states(dimm_entity) | int + (next_Brightness / 1000) }}"
                              target:
                                entity_id: !input dimm_entity
                  until:
                    - condition: template
                      value_template: "{{ ((states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) != FLAG_DIMMING) or (repeat.index >= current_dimm_steps) }}"
              # Step
              - action: input_number.set_value
                data:
                  value: 0
                target:
                  entity_id: !input dimm_entity

    # BRIGHTNESS command
    - conditions:
        - condition: trigger
          id: "value_address"
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload[0] | int(default=0) == 0 }}"
            sequence:
                - action: light.turn_off
                  target:
                    entity_id: "{{ light_entity }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload[0] | int(default=0) != 0 }}"
            sequence:
                - action: light.turn_on
                  data:
                    brightness: "{{ trigger.payload[0] | int(default=255) }}"
                  target:
                    entity_id: "{{ light_entity }}"

    # BRIGHTNESS read
    - conditions:
        - condition: trigger
          id: "value_state_address"
      sequence:
        - action: knx.send
          data:
            address: "{{ value_state_address }}"
            payload: "{{ state_attr(light_entity, 'brightness') | int(default=0) }}"
            response: true

    # TEMPERATURE command
    - conditions:
        - condition: trigger
          id: "temperature_address"
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.value| int(default=3000) != 0 }}"
            sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light_entity }}"
                  data:
                    color_temp_kelvin: "{{ trigger.value | int(default=3000) }}"

    # TEMPERATURE read
    - conditions:
        - condition: trigger
          id: "temperature_state_address"
      sequence:
        - action: knx.send
          data:
            address: "{{ temperature_state_address }}"
            type: color_temperature
            payload: "{{ state_attr(light_entity, 'color_temp_kelvin') | int(default=0) }}"
            response: true

    # RGB command
    - conditions:
        - condition: trigger
          id: "rgb_color_address"
      sequence:
        # Turn off command (only 00)
        - if:
            - condition: template
              value_template: "{{ trigger.payload[0] | int(default=0) == 0 and trigger.payload[1] | int(default=0) == 0 and trigger.payload[2] | int(default=0) == 0 }}"
          then:
            - action: light.turn_off
              target:
                entity_id: "{{ light_entity }}"
        # RGB value command
          else:
            - variables:
                brightness: "{{ ((trigger.payload[0] * 0.299) + (trigger.payload[1] * 0.587) + (trigger.payload[2] * 0.114)) | int }}"
            - action: light.turn_on
              target:
                entity_id: "{{ light_entity }}"
              data:
                brightness: "{{ brightness }}"
                rgb_color:
                  - "{{ trigger.payload[0] | int(default=0) }}"
                  - "{{ trigger.payload[1] | int(default=0) }}"
                  - "{{ trigger.payload[2] | int(default=0) }}"
    # RGB read
    - conditions:
        - condition: trigger
          id: "rgb_color_state_address"
      sequence:
        # RGB value is set
        - if:
            - condition: template
              value_template: "{{ state_attr(light_entity, 'rgb_color')[0] is defined and state_attr(light_entity, 'rgb_color')[1] is defined and state_attr(light_entity, 'rgb_color')[2] is defined }}"
          then:
            - action: knx.send
              data:
                address: "{{ rgb_color_state_address }}"
                payload:
                  - "{{ state_attr(light_entity, 'rgb_color')[0] | int(default=0) }}"
                  - "{{ state_attr(light_entity, 'rgb_color')[1] | int(default=0) }}"
                  - "{{ state_attr(light_entity, 'rgb_color')[2] | int(default=0) }}"
                response: true
        # No RGB value is set
          else:
            - action: knx.send
              data:
                address: "{{ rgb_color_state_address }}"
                payload:
                  - 0
                  - 0
                  - 0
                response: true

    # STATE FEEDBACK
    - conditions:
        - condition: trigger
          id: "light_entity"
      sequence:
        - variables:
            transition_dimming_active: >
              {{ not is_disabled_mode and (is_transition_mode or is_transition_step_mode) and ((states(dimm_entity) | int | bitwise_and(FLAG_DIMMING)) == FLAG_DIMMING) }}

        - if:
            - condition: template
              value_template: "{{ is_disabled_mode }}"
          then:
            # SWITCH change
            - if:
                - condition: template
                  value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
                - condition: template
                  value_template: "{{ switch_state_address != None }}"
              then:
                - choose:

                  # Light turned OFF
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.to_state.state == 'off' }}"
                    sequence:
                      - action: knx.send
                        data:
                          address: "{{ switch_state_address }}"
                          payload: 0

                  # Light turned ON
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.to_state.state == 'on' }}"
                    sequence:
                      - action: knx.send
                        data:
                          address: "{{ switch_state_address }}"
                          payload: 1

          else:

            # SWITCH change
            - if:
                - condition: template
                  value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
                - condition: template
                  value_template: "{{ switch_state_address != None }}"
                - condition: template
                  value_template: "{{ not transition_dimming_active }}"
              then:
                - choose:

                  # Light turned OFF
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.to_state.state == 'off' }}"
                      - condition: template
                        value_template: >
                          {{ (states(dimm_entity) | int | bitwise_and(FLAG_STATE_ON)) == FLAG_STATE_ON }}
                    sequence:
                      - action: knx.send
                        data:
                          address: "{{ switch_state_address }}"
                          payload: 0

                      - action: input_number.set_value
                        target:
                          entity_id: !input dimm_entity
                        data:
                          value: >
                            {{ states(dimm_entity) | float - (states(dimm_entity) | int | bitwise_and(FLAG_STATE_ON)) }}

                  # Light turned ON
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.to_state.state == 'on' }}"
                      - condition: template
                        value_template: >
                          {{ (states(dimm_entity) | int | bitwise_and(FLAG_STATE_ON)) != FLAG_STATE_ON }}
                    sequence:
                      - action: knx.send
                        data:
                          address: "{{ switch_state_address }}"
                          payload: 1

                      - action: input_number.set_value
                        target:
                          entity_id: !input dimm_entity
                        data:
                          value: >
                            {{ states(dimm_entity) | float - (states(dimm_entity) | int) + (states(dimm_entity) | int | bitwise_or(FLAG_STATE_ON)) }}

        # BRIGHTNESS change
        - if:
            - condition: template
              value_template: "{{ value_state_address != None }}"
            - condition: template
              value_template: "{{ not transition_dimming_active }}"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.brightness is defined and trigger.from_state.attributes.brightness is defined and trigger.to_state.attributes.brightness != trigger.from_state.attributes.brightness }}"
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.brightness is defined and trigger.from_state.attributes.brightness is not defined }}"
                - condition: template
                  value_template: "{{ trigger.from_state.attributes.brightness is defined and trigger.to_state.attributes.brightness is not defined }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.brightness is defined }}"
              then:
                - action: knx.send
                  data:
                    address: "{{ value_state_address }}"
                    payload: "{{ trigger.to_state.attributes.brightness | int(default=0) }}"
              else:
                - action: knx.send
                  data:
                    address: "{{ value_state_address }}"
                    payload: 0

        # TEMPERATURE change
        - if:
            - condition: template
              value_template: "{{ temperature_state_address != None }}"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.color_temp_kelvin is defined and trigger.from_state.attributes.color_temp_kelvin is defined and trigger.to_state.attributes.color_temp_kelvin != trigger.from_state.attributes.color_temp_kelvin }}"
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.color_temp_kelvin is defined and trigger.from_state.attributes.color_temp_kelvin is not defined }}"
                - condition: template
                  value_template: "{{ trigger.from_state.attributes.color_temp_kelvin is defined and trigger.to_state.attributes.color_temp_kelvin is not defined }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.color_temp_kelvin is defined }}"
              then:
                - action: knx.send
                  data:
                    address: "{{ temperature_state_address }}"
                    type: color_temperature
                    payload: "{{ trigger.to_state.attributes.color_temp_kelvin | int(default=0) }}"
              else:
                - action: knx.send
                  data:
                    address: "{{ temperature_state_address }}"
                    type: color_temperature
                    payload: 0

        # RGB change
        - if:
            - condition: template
              value_template: "{{ rgb_color_state_address != None }}"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.rgb_color is defined and trigger.from_state.attributes.rgb_color is defined and trigger.to_state.attributes.rgb_color != trigger.from_state.attributes.rgb_color }}"
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.rgb_color is defined and trigger.from_state.attributes.rgb_color is not defined }}"
                - condition: template
                  value_template: "{{ trigger.from_state.attributes.rgb_color is defined and trigger.to_state.attributes.rgb_color is not defined }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ trigger.to_state.attributes.rgb_color[0] is defined and trigger.to_state.attributes.rgb_color[1] is defined and trigger.to_state.attributes.rgb_color[2] is defined }}"
              then:
                - action: knx.send
                  data:
                    address: "{{ rgb_color_state_address }}"
                    payload:
                      - "{{ trigger.to_state.attributes.rgb_color[0] | int(default=0) }}"
                      - "{{ trigger.to_state.attributes.rgb_color[1] | int(default=0) }}"
                      - "{{ trigger.to_state.attributes.rgb_color[2] | int(default=0) }}"
              else:
                - action: knx.send
                  data:
                    address: "{{ rgb_color_state_address }}"
                    payload:
                      - 0
                      - 0
                      - 0